<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Semantic Chess</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151923;color:#f5e9d0;font:16px system-ui;padding:20px}main{max-width:1100px;margin:auto}h1{font-family:Georgia;margin:0}p{color:#c4c6ce}section{display:grid;grid-template-columns:minmax(0,700px) minmax(210px,1fr);gap:22px}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border:3px solid #bba26a;aspect-ratio:1}.tile{position:relative;min-width:0;aspect-ratio:1;border:1px solid #222;background-size:100% 100%;background-position:center;background-color:#555;color:white;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.tile.selected{outline:4px solid gold;outline-offset:-4px}.tile.legal:after{content:"";position:absolute;inset:4px;border:3px solid #35e7a0;pointer-events:none}.piece{font-size:clamp(18px,5vw,48px);line-height:1;text-shadow:0 0 3px #fff,0 1px 3px black;filter:drop-shadow(0 2px 2px #000)}.name,.place{background:#161616e8;color:white;padding:1px 3px;font-size:clamp(7px,1.15vw,12px);border-radius:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.place{position:absolute;bottom:2px}.name{margin-bottom:12px}.white{color:#fff;text-shadow:0 0 3px #000,0 1px 3px #000}.black{color:#111}button.action{padding:8px 12px;background:#303a4b;color:white;border:1px solid #777;border-radius:6px;cursor:pointer}#log{max-height:550px;overflow:auto;padding-left:24px}#log li{padding:5px 0}#status{min-height:25px}@media(max-width:760px){section{grid-template-columns:1fr}body{padding:8px}}
</style><main><h1>Semantic Chess</h1><p>Same game. Same mathematics. Different ontology.</p><div id="status" role="status"></div><section><div class="board" id="board" aria-label="Chessboard"></div><aside><button class="action" id="reset">New game</button> <button class="action" id="mode">Traditional board</button><h2>World history</h2><ol id="log"></ol><small>Flags supplied by FlagCDN; internet required for flag artwork.</small></aside></section></main>
<script>
let state, selected=null, busy=false, semantic=true;
const board=document.querySelector('#board'), status=document.querySelector('#status'), log=document.querySelector('#log');
const glyph={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟',K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
async function request(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error);return data}
function render(){board.replaceChildren();status.textContent=state.result?'Game over: '+state.result:state.turn+' to move'+(state.check?' · Check':'');for(const s of state.squares){const t=document.createElement('button');t.className='tile';t.type='button';t.title=s.square+' · '+s.name+(s.piece?' · '+s.piece.name+' ('+s.piece.capability+')':'');t.setAttribute('aria-label',t.title);const parity=(s.square.charCodeAt(0)-97+Number(s.square[1]))%2;t.style.backgroundColor=parity?'#a78158':'#e2d0ab';if(semantic)t.style.backgroundImage='url(https://flagcdn.com/w320/'+s.code+'.png)';if(selected===s.square)t.classList.add('selected');if(selected&&state.legal.some(m=>m.startsWith(selected+s.square)))t.classList.add('legal');if(s.piece){const p=document.createElement('span');p.className='piece '+(s.piece.symbol===s.piece.symbol.toUpperCase()?'white':'black');p.textContent=glyph[s.piece.symbol];t.append(p);if(semantic){const n=document.createElement('span');n.className='name';n.textContent=s.piece.name+(s.piece.self_actualized?' ★':'');t.append(n)}}const label=document.createElement('span');label.className='place';label.textContent=semantic?s.name:s.square;t.append(label);t.onclick=()=>choose(s.square);board.append(t)}log.replaceChildren();for(const e of state.history){const li=document.createElement('li');li.textContent=semantic?e.actor.name+' travels from '+e.origin+' to '+e.destination+(e.captured?', capturing '+e.captured.name:'')+(e.promotion?' · Self-actualized: '+e.promotion:'')+(e.rook?' · '+e.rook.actor.name+' travels to '+e.rook.destination:'')+' ('+e.san+')':e.san;log.append(li)}log.scrollTop=log.scrollHeight}
async function choose(s){if(busy||state.result)return;const moves=selected?state.legal.filter(m=>m.startsWith(selected+s)):[];if(moves.length){let move=moves[0];if(moves.length>1){const p=prompt('Self-actualization: q (queen), r (rook), b (bishop), n (knight)','q');if(!p)return;move=moves.find(m=>m[4]===p.toLowerCase());if(!move)return}busy=true;try{state=await request('/api/move',{uci:move});selected=null;render()}catch(e){status.textContent=e.message}finally{busy=false}}else{selected=state.legal.some(m=>m.startsWith(s))?s:null;render()}}
document.querySelector('#reset').onclick=async()=>{if(busy)return;busy=true;try{state=await request('/api/reset',{});selected=null;render()}catch(e){status.textContent=e.message}finally{busy=false}};
document.querySelector('#mode').onclick=e=>{if(!state)return;semantic=!semantic;e.target.textContent=semantic?'Traditional board':'Flag board';render()};
request('/api/state').then(s=>{state=s;render()}).catch(e=>status.textContent=e.message);
</script></html>
