<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Semantic Chess</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151923;color:#f5e9d0;font:16px system-ui;padding:20px}main{max-width:1100px;margin:auto}h1{font-family:Georgia;margin:0}p{color:#c4c6ce}section{display:grid;grid-template-columns:minmax(0,700px) minmax(210px,1fr);gap:22px}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border:3px solid #bba26a;aspect-ratio:1}.tile{position:relative;min-width:0;aspect-ratio:1;border:1px solid #222;background-size:100% 100%;background-position:center;background-color:#555;color:white;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.tile.selected{outline:4px solid gold;outline-offset:-4px}.tile.legal:after{content:"";position:absolute;inset:4px;border:3px solid #35e7a0;pointer-events:none}.piece{font-size:clamp(18px,5vw,48px);line-height:1;text-shadow:0 0 3px #fff,0 1px 3px black;filter:drop-shadow(0 2px 2px #000)}.name,.place{background:#161616e8;color:white;padding:1px 3px;font-size:clamp(7px,1.15vw,12px);border-radius:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.place{position:absolute;bottom:2px}.name{margin-bottom:12px}.white{color:#fff;text-shadow:0 0 3px #000,0 1px 3px #000}.black{color:#111}button.action{padding:8px 12px;background:#303a4b;color:white;border:1px solid #777;border-radius:6px;cursor:pointer}#log{max-height:550px;overflow:auto;padding-left:24px}#log li{padding:5px 0}#status{min-height:25px}@media(max-width:760px){section{grid-template-columns:1fr}body{padding:8px}}
 
main{max-width:none}section{grid-template-columns:minmax(0,1fr) minmax(220px,300px);align-items:start}.board{width:min(100%,max(320px,calc(100dvh - 140px)));max-width:100%;container-type:inline-size;justify-self:center}.piece{font-size:7cqw}.name,.place{font-size:1.65cqw}.name{margin-bottom:1.8cqw}.tile{min-height:0}.board.hover-labels .place{visibility:hidden}.board.hover-labels .tile:hover .place,.board.hover-labels .tile:focus-visible .place{visibility:visible}.board.no-labels .place{display:none}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}select,input{max-width:100%;background:#303a4b;color:white;border:1px solid #777;border-radius:5px;padding:7px}#command{width:100%}#heard{min-height:2em;font-size:13px;color:#ddd}button:disabled{opacity:.5;cursor:default}@media(max-width:850px){section{grid-template-columns:1fr}.board{width:min(100%,calc(100dvh - 100px));min-width:0}}@media(max-width:500px){.board{width:100%}.name,.place{font-size:2cqw}}

/* Pieces are independent foreground tokens, not part of the flag artwork. */
.tile{isolation:isolate;display:block}
.token{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:78%;height:75%;display:grid;place-items:center;pointer-events:none;z-index:1}
.token::before{content:"";position:absolute;inset:5% 3%;border-radius:50%;background:radial-gradient(ellipse,rgba(250,248,231,.98) 0%,rgba(250,248,231,.87) 45%,rgba(250,248,231,.35) 68%,transparent 76%);filter:drop-shadow(0 2px 2px #0009)}
.token.light::before{background:radial-gradient(ellipse,#18202c 0%,#18202ce8 45%,#18202c66 68%,transparent 76%)}
.piece-art{position:relative;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 1px #000a)}
.name{position:absolute;z-index:2;left:50%;bottom:13%;transform:translateX(-50%);margin:0;font-size:clamp(8px,1.85cqw,16px);font-weight:750;line-height:1.1;padding:2px 5px;background:#111e;color:#fff;border:1px solid #ffffff70;border-radius:5px;pointer-events:none}
.place{z-index:3;left:50%;transform:translateX(-50%);font-size:clamp(7px,1.45cqw,13px);line-height:1.1;pointer-events:none}
.tile.legal:after{z-index:4}
.tile.selected .token{filter:drop-shadow(0 0 3px gold)}
.board.no-labels .token,.board.hover-labels .token{top:46%}
.board.no-labels .name,.board.hover-labels .name{bottom:5%}
.board.hover-labels .tile:hover .name,.board.hover-labels .tile:focus-visible .name{bottom:17%}
.board.plain .token{height:92%;top:46%}
.board.flat .token::before{display:none}
.board.flat .piece-art{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 1px 2px #000)}
@media(max-width:500px){.name{font-size:clamp(7px,2cqw,10px);padding:1px 2px}.place{font-size:clamp(6px,1.7cqw,10px)}}

[hidden]{display:none!important}
.board-stage{min-width:0;width:100%;display:flex;justify-content:center}
.three-stage{position:relative;width:min(100%,max(320px,calc(100dvh - 100px)));aspect-ratio:1;overflow:hidden;border:1px solid #665a46;border-radius:12px;background:radial-gradient(ellipse at center,#303743,#11151d 75%);touch-action:none}
.three-stage canvas{display:block;width:100%;height:100%;touch-action:none}
.three-stage .view-help{position:absolute;left:12px;top:10px;pointer-events:none;font-size:12px;color:#e4dbc8;background:#111b;padding:6px 9px;border-radius:5px}
.three-stage .view-info{position:absolute;left:12px;bottom:10px;right:12px;pointer-events:none;text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 3px #000}
.three-stage .labels3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.label3d{position:absolute;transform:translate(-50%,-50%);background:#151923eb;color:#fff;border:1px solid #ffffff40;padding:2px 4px;border-radius:4px;white-space:nowrap;font-size:clamp(8px,1.3vw,13px);line-height:1.05;text-shadow:0 1px 2px #000}
.label3d.character{font-weight:700;z-index:2}
.label3d.country{font-size:clamp(7px,1.15vw,11px);opacity:.9}
#viewStatus{font-size:12px;color:#e4dbc8;min-height:1em}
@media(max-width:850px){.three-stage{width:min(100%,calc(100dvh - 90px))}}
@media(max-width:500px){.three-stage{width:100%}}

.game-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.game-tools a{color:#e9d9ac;font-size:13px;padding:6px;text-decoration:underline}
.tile.last:before{content:"";position:absolute;inset:0;border:3px solid #81c6ff;pointer-events:none;z-index:4}
.tile.capture.legal:after{border-color:#ffb86b}
#activeSettings{font-size:13px;color:#d3c4a9;margin:4px 0}
</style><main><h1>Semantic Chess</h1><p>Same game. Same mathematics. Different ontology.</p><div id="status" role="status"></div><section><div class="board-stage"><div class="board" id="board" aria-label="Chessboard"></div><div class="three-stage" id="threeStage" hidden><canvas id="threeCanvas" aria-label="Interactive 3D chessboard; use 2D view for keyboard square selection"></canvas><div class="labels3d" id="threeLabels"></div><div class="view-help">Drag to rotate · Scroll / pinch to zoom</div><div class="view-info" id="threeInfo"></div></div></div><aside><div class="controls"><label>Opponent <select id="opponent"><option value="human">Two players</option><option value="stockfish">Stockfish (Black)</option></select></label><label>Difficulty <select id="difficulty"><option value="casual">Casual</option><option value="standard">Standard</option><option value="challenge">Challenge</option></select></label><button class="action" id="reset">New game / lottery</button><button class="action" id="mode">Traditional board</button><label>Board view <select id="boardView"><option value="2d">2D overhead</option><option value="3d">3D tabletop</option></select></label><button class="action" id="flip3d" hidden>Flip view</button><button class="action" id="top3d" hidden>Overhead camera</button><button class="action" id="home3d" hidden>Reset camera</button><div id="viewStatus" role="status"></div><label>Piece style <select id="pieceStyle"><option value="halo">Raised + halo</option><option value="flat">Raised only</option></select></label><label>Flag names <select id="labels"><option value="always">Always visible</option><option value="hover">Hover / focus</option><option value="none">Hidden</option></select></label></div><div id="seed"></div><div id="activeSettings"></div><div class="game-tools"><button class="action" id="undo">Undo</button><button class="action" id="sameSeed">Replay this layout</button><a href="/api/export/json" download>Game JSON</a><a href="/api/export/pgn" download>PGN</a></div><h2>Voice control</h2><button class="action" id="listen">🎙 Listen</button><div id="heard" role="status"></div><form id="voiceform"><label for="command">Command preview (e.g. Eva to Japan)</label><input id="command" autocomplete="off"><button class="action" type="submit">Preview move</button></form><button class="action" id="confirm" disabled>Confirm move</button><button class="action" id="retry" hidden>Retry computer move</button><h2>World history</h2><ol id="log"></ol><small>Flags supplied by FlagCDN; internet required for flag artwork.</small></aside></section></main>
<script>
let state, selected=null, busy=false, semantic=true, pending=null, threeView=null, viewRequest=0;
const board=document.querySelector('#board'), status=document.querySelector('#status'), log=document.querySelector('#log');
const glyph={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟',K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};

const shapes={
 p:'M32 33 C23 33 18 26 18 18 A14 14 0 0 1 46 18 C46 26 41 33 32 33 Z M24 32 H40 L43 45 Q44 51 51 55 H13 Q20 51 21 45 Z',
 r:'M12 6 H23 V15 H27 V6 H37 V15 H41 V6 H52 V23 L45 30 H19 L12 23 Z M22 29 H42 L45 49 L51 55 H13 L19 49 Z',
 n:'M14 54 Q17 43 25 35 L15 39 L9 30 L23 12 L23 5 L34 12 Q48 13 51 28 L50 47 L55 55 Z M23 21 L29 19',
 b:'M32 4 C36 11 45 17 45 26 Q45 36 32 39 Q19 36 19 26 C19 17 28 11 32 4 Z M24 38 H40 L45 50 L51 55 H13 L19 50 Z M33 12 L26 25',
 q:'M11 15 L23 31 L32 12 L41 31 L53 15 L46 43 H18 Z M20 43 H44 L49 55 H15 Z M11 14 A3 3 0 1 0 10.9 14 Z M32 11 A3 3 0 1 0 31.9 11 Z M53 14 A3 3 0 1 0 52.9 14 Z',
 k:'M29 3 H35 V12 H44 V18 H35 V25 H29 V18 H20 V12 H29 Z M32 27 Q21 14 14 25 Q8 36 22 43 H42 Q56 36 50 25 Q43 14 32 27 Z M22 43 H42 L49 55 H15 Z'
};
function pieceToken(piece,square){
 const white=piece.symbol===piece.symbol.toUpperCase(), id='shade-'+square;
 const token=document.createElement('span');token.className='token '+(white?'light':'dark');
 const ns='http://www.w3.org/2000/svg', svg=document.createElementNS(ns,'svg');
 svg.setAttribute('viewBox','0 0 64 66');svg.setAttribute('class','piece-art');svg.setAttribute('aria-hidden','true');
 const fill=white?['#ffffff','#e8d9b8','#9f896a']:['#788391','#26313e','#090e17'];
 const stroke=white?'#473a2c':'#e5e9ee';
 svg.innerHTML='<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+fill[0]+'"/><stop offset=".45" stop-color="'+fill[1]+'"/><stop offset="1" stop-color="'+fill[2]+'"/></linearGradient></defs><ellipse cx="32" cy="62" rx="25" ry="3" fill="#000" opacity=".42"/><g fill="url(#'+id+')" stroke="'+stroke+'" stroke-width="1.6" stroke-linejoin="round"><path d="'+shapes[piece.symbol.toLowerCase()]+'"/><rect x="10" y="54" width="44" height="7" rx="2"/></g><path d="M15 56 H49" stroke="'+fill[0]+'" stroke-width="1.1" opacity=".8"/>';
 token.append(svg);return token;
}

async function request(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,revision:state?.revision})});const data=await r.json();if(!r.ok){if(r.status===409&&data.state){state=data.state;selected=null;syncSettings();render()}throw Error(data.error);}return data}
function syncSettings(){document.querySelector('#opponent').value=state.opponent;document.querySelector('#difficulty').value=state.difficulty}
function render(){pending=null;document.querySelector('#undo').disabled=!state.history.length;document.querySelector('#activeSettings').textContent=(state.opponent==='stockfish'?'Stockfish · '+state.difficulty:'Two players')+' · '+state.history.length+' plies · Autosaved';document.querySelector('#confirm').disabled=true;document.querySelector('#seed').textContent='Lottery seed: '+state.seed;document.querySelector('#retry').hidden=!(state.opponent==='stockfish'&&state.turn==='black'&&!state.result);board.className='board '+(semantic?({hover:'hover-labels',none:'no-labels'}[document.querySelector('#labels').value]||''):'');board.classList.toggle('flat',document.querySelector('#pieceStyle').value==='flat');board.classList.toggle('plain',!semantic);board.replaceChildren();status.textContent=state.result?'Game over: '+state.result+' · '+state.termination:state.turn+' to move'+(state.check?' · Check':'');for(const s of state.squares){const t=document.createElement('button');t.className='tile';t.type='button';t.title=s.square+' · '+s.name+(s.piece?' · '+s.piece.name+' ('+s.piece.capability+')':'');t.setAttribute('aria-label',t.title);const parity=(s.square.charCodeAt(0)-97+Number(s.square[1]))%2;t.style.backgroundColor=parity?'#a78158':'#e2d0ab';if(semantic)t.style.backgroundImage='url(https://flagcdn.com/w320/'+s.code+'.png)';const last=state.history.at(-1)?.uci;if(last&&(last.slice(0,2)===s.square||last.slice(2,4)===s.square))t.classList.add('last');if(selected===s.square)t.classList.add('selected');if(selected&&state.legal.some(m=>m.startsWith(selected+s.square))){t.classList.add('legal');if(s.piece||state.squares.find(x=>x.square===selected)?.piece?.capability==='pawn'&&selected[0]!==s.square[0])t.classList.add('capture')}if(s.piece){t.append(pieceToken(s.piece,s.square));if(semantic){const n=document.createElement('span');n.className='name';n.textContent=s.piece.name+(s.piece.self_actualized?' ★':'');t.append(n)}}const label=document.createElement('span');label.className='place';label.textContent=semantic?s.name:s.square;t.append(label);t.onclick=()=>choose(s.square);board.append(t)}log.replaceChildren();for(const e of state.history){const li=document.createElement('li');li.textContent=semantic?e.actor.name+' travels from '+e.origin+' to '+e.destination+(e.captured?', capturing '+e.captured.name:'')+(e.promotion?' · Self-actualized: '+e.promotion:'')+(e.rook?' · '+e.rook.actor.name+' travels to '+e.rook.destination:'')+' ('+e.san+')':e.san;log.append(li)}log.scrollTop=log.scrollHeight;syncThree()}
async function choose(s){if(!state||busy||state.result||(state.opponent==='stockfish'&&state.turn==='black'))return;const moves=selected?state.legal.filter(m=>m.startsWith(selected+s)):[];if(moves.length){let move=moves[0];if(moves.length>1){const p=prompt('Self-actualization: q (queen), r (rook), b (bishop), n (knight)','q');if(!p)return;move=moves.find(m=>m[4]===p.toLowerCase());if(!move)return}await submitMove(move)}else{selected=state.legal.some(m=>m.startsWith(s))?s:null;render()}}
async function newGame(same=false){
 if(!state||busy)return;
 if(state.history.length&&!window.confirm('Replace the current saved game? Export it first if you want to keep it.'))return;
 busy=true;try{
  const options={opponent:document.querySelector('#opponent').value,difficulty:document.querySelector('#difficulty').value};
  if(same)options.seed=state.seed;
  state=await request('/api/reset',options);selected=null;syncSettings();render();
 }catch(e){status.textContent=e.message}finally{busy=false}
}
document.querySelector('#reset').onclick=()=>newGame();
document.querySelector('#sameSeed').onclick=()=>newGame(true);
document.querySelector('#undo').onclick=async()=>{if(!state||busy||!state.history.length)return;busy=true;try{state=await request('/api/undo',{});selected=null;render()}catch(e){status.textContent=e.message}finally{busy=false}};
document.querySelector('#mode').onclick=e=>{if(!state)return;semantic=!semantic;e.target.textContent=semantic?'Traditional board':'Flag board';render()};

async function computerTurn(){
 if(state.opponent==='stockfish'&&state.turn==='black'&&!state.result){
 status.textContent='Stockfish thinking…';
 state=await request('/api/computer',{});render();
 }
}
async function submitMove(move){
 if(busy)return;busy=true;
 try{state=await request('/api/move',{uci:move});selected=null;render();await computerTurn()}
 catch(e){status.textContent=e.message}finally{busy=false}
}
document.querySelector('#retry').onclick=async()=>{if(busy)return;busy=true;try{await computerTurn()}catch(e){status.textContent=e.message}finally{busy=false}};
document.querySelector('#labels').onchange=()=>{if(state)render()};
document.querySelector('#pieceStyle').onchange=()=>{if(state)render()};
const heard=document.querySelector('#heard'), command=document.querySelector('#command'), confirm=document.querySelector('#confirm');
const normalize=t=>t.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/ +/g,' ').trim();
function preview(raw){
 pending=null;confirm.disabled=true;
 if(!state||busy||state.result||(state.opponent==='stockfish'&&state.turn==='black')){heard.textContent='No human move due.';return}
 const normalized=normalize(raw).replace(/^move /,'').replace(/\b(?:usa|united states(?: of america)?)\b/g,'america').replace(/\bcolumbia\b/g,'colombia');
 const m=normalized.match(/^(.+?) (?:to|two) (.+?)(?: (?:as|promote to) (queen|rook|bishop|knight))?$/);
 if(!m){heard.textContent='Use character name to country name, e.g. Eva to Japan.';return}
 const src=state.squares.find(s=>s.piece&&normalize(s.piece.name)===m[1]);
 const dst=state.squares.find(s=>normalize(s.name)===m[2]||s.square===m[2]);
 if(!src||!dst){heard.textContent='Character or destination not recognized.';return}
 let moves=state.legal.filter(x=>x.startsWith(src.square+dst.square));
 if(m[3])moves=moves.filter(x=>x[4]===({queen:'q',rook:'r',bishop:'b',knight:'n'}[m[3]]));
 if(moves.length!==1){heard.textContent=moves.length?'Specify promotion: as queen, rook, bishop or knight.':'That move is not legal.';return}
 selected=src.square;render();pending=moves[0];confirm.disabled=false;
 heard.textContent='Confirm: '+src.piece.name+' → '+dst.name+(m[3]?' as '+m[3]:'')+' ('+pending+')';
}
document.querySelector('#voiceform').onsubmit=e=>{e.preventDefault();preview(command.value)};
command.oninput=()=>{pending=null;confirm.disabled=true};
confirm.onclick=()=>{if(pending){const move=pending;pending=null;confirm.disabled=true;submitMove(move)}};
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
const listen=document.querySelector('#listen');
if(!Speech){listen.disabled=true;heard.textContent='Speech recognition unavailable in this browser. Type a command instead.'}
else{listen.onclick=()=>{const speech=new Speech();speech.lang='en-US';speech.interimResults=false;listen.disabled=true;
 speech.onresult=e=>{command.value=e.results[0][0].transcript;preview(command.value)};
 speech.onerror=e=>{heard.textContent='Microphone: '+e.error};
 speech.onend=()=>{listen.disabled=false};
 try{speech.start()}catch(e){listen.disabled=false;heard.textContent=e.message}
}}

const boardView=document.querySelector('#boardView'), stage3d=document.querySelector('#threeStage'), viewStatus=document.querySelector('#viewStatus');
function syncThree(){if(threeView&&boardView.value==='3d'&&state)threeView.update(state,selected,semantic,document.querySelector('#labels').value)}
function show3d(on){
 board.hidden=on;stage3d.hidden=!on;
 for(const id of ['flip3d','top3d','home3d'])document.getElementById(id).hidden=!on;
 if(threeView)threeView.setActive(on);
}
function fallback3d(message){viewRequest++;boardView.value='2d';show3d(false);viewStatus.textContent=message}
boardView.onchange=async()=>{
 const serial=++viewRequest;
 if(boardView.value==='2d'){show3d(false);viewStatus.textContent='';return}
 viewStatus.textContent='Loading 3D renderer…';
 try{
  if(threeView?.isFailed())throw Error('WebGL context was lost. Reload to retry.');
  if(!threeView){
   const module=await import('/web/board3d.js');
   if(serial!==viewRequest)return;
   threeView=module.createBoard3D({stage:stage3d,canvas:document.querySelector('#threeCanvas'),labels:document.querySelector('#threeLabels'),info:document.querySelector('#threeInfo'),choose,fail:message=>fallback3d(message)});
  }
  if(serial!==viewRequest)return;
  show3d(true);syncThree();viewStatus.textContent='3D tabletop active';
 }catch(e){if(serial===viewRequest)fallback3d('3D unavailable; 2D remains playable. '+e.message)}
};
document.querySelector('#flip3d').onclick=()=>threeView?.flip();
document.querySelector('#top3d').onclick=()=>threeView?.overhead();
document.querySelector('#home3d').onclick=()=>threeView?.home();
request('/api/state').then(s=>{state=s;syncSettings();render()}).catch(e=>status.textContent=e.message);
</script></html>
