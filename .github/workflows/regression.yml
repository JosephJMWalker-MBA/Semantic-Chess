name: Semantic Chess regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser scripts
        run: |
          python -c "from pathlib import Path; s=Path('web/index.html').read_text(); Path('/tmp/semantic-client.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/semantic-client.js
          cp web/board3d.js /tmp/semantic-board.mjs
          node --check /tmp/semantic-board.mjs
